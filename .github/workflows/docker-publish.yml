name: Build and Publish Docker Images to GitHub Container Registry (GHCR)

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_API=${REPO_LOWER}/simplex-api" >> $GITHUB_ENV
          echo "IMAGE_NAME_WEB=${REPO_LOWER}/simplex-web" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Central API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.sha }}

      - name: Build and Push Web Portal Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}

      - name: Package Client Delivery ZIP
        run: |
          cd delivery
          zip -r ../simplex-delivery.zip .

      - name: Upload Client Delivery ZIP as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplex-delivery-zip
          path: simplex-delivery.zip

      - name: Release to GitHub Releases (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            simplex-delivery.zip
            SIMPLEX_Client_Installation_Guide_Windows_Linux_Mac.pdf
            SIMPLEX_Central_Operations_Console_Project_Documentation.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
