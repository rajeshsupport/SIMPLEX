<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HMC Desktop Automation Agent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 1.5rem; }
    h2 { margin-top: 0; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; }
    .status-badge { font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 9999px; background: #059669; color: #fff; }
    .card { background: #1e293b; padding: 1.25rem; border-radius: 0.5rem; border: 1px solid #334155; margin-bottom: 1.25rem; }
    .log-box { background: #020617; border: 1px solid #1e293b; border-radius: 0.375rem; padding: 1rem; height: 260px; overflow-y: auto; font-family: monospace; font-size: 0.8125rem; color: #94a3b8; }
    .log-entry { margin-bottom: 0.4rem; }
    .btn { background: #0284c7; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.25rem; cursor: pointer; font-weight: 600; }
    .input { background: #0f172a; border: 1px solid #334155; padding: 0.5rem; color: white; border-radius: 0.25rem; }
  </style>
</head>
<body>
  <h2>
    <span>HMC Desktop Automation Agent</span>
    <span id="agentStatus" class="status-badge">ONLINE</span>
  </h2>

  <div class="card">
    <div style="display: flex; gap: 1rem; align-items: center;">
      <div><strong>Target API:</strong> <span id="apiHost">http://localhost:3000</span></div>
      <div><strong>Isolation Profile:</strong> <span style="color: #4ade80;">Active</span></div>
    </div>
  </div>

  <div class="card">
    <h4 style="margin-top: 0; margin-bottom: 0.75rem; color: #94a3b8;">Automation Activity & Telemetry Log</h4>
    <div id="logs" class="log-box">
      <div class="log-entry" style="color: #38bdf8;">[INIT] Desktop Automation Agent initialized. Heartbeat listener active.</div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('agent-log', (_, message) => {
      const logs = document.getElementById('logs');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
      logs.appendChild(entry);
      logs.scrollTop = logs.scrollHeight;
    });
  </script>
</body>
</html>
